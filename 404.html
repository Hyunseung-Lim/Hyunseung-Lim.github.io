<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/" />
    <title>Redirecting…</title>
    <script>
      (function () {
        try {
          var path = window.location.pathname + window.location.search + window.location.hash;
          window.sessionStorage.setItem('spa-redirect-path', path);
        } catch (error) {
          /* sessionStorage might be unavailable */
        }
        window.location.replace('/');
      })();
    </script>
  </head>
  <body>
    <noscript>
      Redirecting… If you are not redirected automatically, please <a href="/">visit the homepage</a>.
    </noscript>
  </body>
</html>
